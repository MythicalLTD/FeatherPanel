<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Offline</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                font-family: system-ui, sans-serif;
                background: #0a0a0b;
                color: #f5f5f5;
                text-align: center;
                padding: 24px;
            }
            p {
                opacity: 0.7;
                max-width: 28rem;
                line-height: 1.5;
            }
            button {
                margin-top: 1rem;
                border: 0;
                border-radius: 10px;
                padding: 0.75rem 1.25rem;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div>
            <h1>You're offline</h1>
            <p>Reconnect to the internet, then reload to open the panel again.</p>
            <button type="button" onclick="location.reload()">Try again</button>
        </div>
    </body>
</html>
