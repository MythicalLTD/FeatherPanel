<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var doc = params.get('doc') || 'README.md';
      if (!doc.includes('/')) doc = 'plugins/' + doc;
      location.replace('../view.html?doc=' + encodeURIComponent(doc));
    })();
  </script>
</head>
<body>
  <p>Redirecting to the shared Markdown viewer…</p>
</body>
</html>
