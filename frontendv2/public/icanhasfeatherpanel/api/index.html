<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>API Reference — FeatherPanel Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/icanhasfeatherpanel/assets/docs.css" />
  <style>
    body.fp-docs { padding: 0; }
    .fp-api-shell { max-width: none; padding: 0; }
    .fp-api-shell .fp-nav { margin: 0.75rem 1rem 0; }
    .fp-api-bar { display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; padding:0.75rem 1rem 0.25rem; }
    #redoc-container { min-height: calc(100vh - 120px); }
    .fp-api-shell .fp-footer { margin: 0 1rem 1.5rem; }
  </style>
</head>
<body class="fp-docs">
  <div class="fp-shell fp-api-shell">
    <nav class="fp-nav" aria-label="Documentation">
      <a class="fp-brand" href="/icanhasfeatherpanel/">
        <span class="fp-brand-mark" aria-hidden="true"></span>
        <span>FeatherPanel Docs</span>
      </a>
      <div class="fp-nav-links">
        <a href="/icanhasfeatherpanel/">Home</a>
        <a href="/icanhasfeatherpanel/plugins/">Plugins</a>
        <a href="/icanhasfeatherpanel/widgets/">Widgets</a>
        <a href="/icanhasfeatherpanel/events/">Events</a>

        <a href="/icanhasfeatherpanel/api/" class="active">API</a>
        <a href="/icanhasfeatherpanel/rag/">RAG</a>
      </div>
    </nav>
    <div class="fp-api-bar">
      <a class="fp-badge" href="/icanhasfeatherpanel/api/openapi.json">openapi.json</a>
      <a class="fp-badge" href="/icanhasfeatherpanel/api/index.md">index.md</a>
      <a class="fp-badge" href="/icanhasfeatherpanel/api/index.json">index.json</a>
      <a class="fp-badge" href="/icanhasfeatherpanel/api/oauth2-playground.html">OAuth2 playground</a>
    </div>
  <div id="redoc-container"></div>
  <footer class="fp-footer">Raw OpenAPI for RAG/tools: <a href="/icanhasfeatherpanel/api/openapi.json">openapi.json</a></footer>
  </div>

  <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
  <script>
    Redoc.init('./openapi.json', {
      theme: {
        colors: {
          primary: {
            main: '#60a5fa',
          },
          success: {
            main: '#60a5fa',
          },
          text: {
            primary: '#e5e7eb',
            secondary: '#9ca3af',
          },
          http: {
            get: '#10b981',
            post: '#3b82f6',
            put: '#f59e0b',
            delete: '#ef4444',
            patch: '#8b5cf6',
          },
        },
        typography: {
          fontSize: '14px',
          fontFamily: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
          headings: {
            fontFamily: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
            fontWeight: '600',
          },
          code: {
            fontSize: '13px',
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace',
          },
        },
        sidebar: {
          backgroundColor: '#020617',
          textColor: '#e5e7eb',
          activeTextColor: '#60a5fa',
          groupItems: {
            activeBackgroundColor: '#0f172a',
            activeTextColor: '#60a5fa',
          },
        },
        rightPanel: {
          backgroundColor: '#020617',
        },
      },
      scrollYOffset: 73,
      hideDownloadButton: false,
      hideSingleRequestSampleTab: false,
      menuToggle: true,
      nativeScrollbars: true,
    }, document.getElementById('redoc-container'));

    // Apply custom styles to match dark theme
    const style = document.createElement('style');
    style.textContent = `
      .redoc-wrap {
        min-height: 100vh;
        background: #020617;
        color: #e5e7eb;
      }
      .redoc-wrap .api-content {
        background: #020617;
      }
      .redoc-wrap .menu-content {
        background: #020617;
        border-right: 1px solid #1f2937;
      }
      .redoc-wrap .menu-content a {
        color: #e5e7eb;
      }
      .redoc-wrap .menu-content a:hover {
        color: #60a5fa;
      }
      .redoc-wrap code {
        background: #0f172a;
        color: #e5e7eb;
        border: 1px solid #1f2937;
      }
      .redoc-wrap pre {
        background: #0f172a;
        border: 1px solid #1f2937;
      }
      .redoc-wrap .react-tabs__tab {
        color: #e5e7eb;
      }
      .redoc-wrap .react-tabs__tab--selected {
        color: #60a5fa;
        border-bottom-color: #60a5fa;
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
