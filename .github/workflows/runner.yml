name: Async Runner Jobs

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Async Runner Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93
      - name: Build
        run: cargo build --release --locked --bin async-runner
      - name: Test
        run: cargo test --locked
