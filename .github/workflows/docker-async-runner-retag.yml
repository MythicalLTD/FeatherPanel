name: Docker Retag Async Runner

# Silent hotfix only: rebuild async-runner from this ref and overwrite existing
# image tags (no GitHub Release, no Discord, no new version number).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to overwrite (e.g. v1.5.3)"
        required: true
        default: "v1.5.3"
        type: string
      also_latest:
        description: "Also overwrite :latest"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-async-runner:
    name: Build Async Runner - ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache-key: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-key: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform tag
        id: platform-tag
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Async Runner
        uses: docker/build-push-action@v5
        with:
          context: ./runner
          file: ./runner/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          pull: true
          cache-from: |
            type=registry,ref=ghcr.io/mythicalltd/featherpanel-async-runner:buildcache-${{ matrix.cache-key }}
            type=gha,scope=async-runner-${{ matrix.cache-key }}
          cache-to: |
            type=registry,ref=ghcr.io/mythicalltd/featherpanel-async-runner:buildcache-${{ matrix.cache-key }},mode=max
            type=gha,mode=max,scope=async-runner-${{ matrix.cache-key }}
          tags: |
            ghcr.io/mythicalltd/featherpanel-async-runner:${{ inputs.image_tag }}-${{ steps.platform-tag.outputs.tag }}

  manifest-async-runner:
    name: Overwrite multi-arch tags
    runs-on: ubuntu-latest
    needs: build-async-runner

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          set -eux
          TAG="${{ inputs.image_tag }}"
          docker buildx imagetools create --tag "ghcr.io/mythicalltd/featherpanel-async-runner:${TAG}" \
            "ghcr.io/mythicalltd/featherpanel-async-runner:${TAG}-linux-amd64" \
            "ghcr.io/mythicalltd/featherpanel-async-runner:${TAG}-linux-arm64"
          if [ "${{ inputs.also_latest }}" = "true" ]; then
            docker buildx imagetools create --tag ghcr.io/mythicalltd/featherpanel-async-runner:latest \
              "ghcr.io/mythicalltd/featherpanel-async-runner:${TAG}-linux-amd64" \
              "ghcr.io/mythicalltd/featherpanel-async-runner:${TAG}-linux-arm64"
          fi
