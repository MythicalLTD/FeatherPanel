name: FeatherCli Migration

on: [push, pull_request]

permissions:
  contents: read

# Every commit:
#   - Build on amd64 + arm64
#   - Migrate smoke for Pterodactyl v1 + v2 on both arches
jobs:
  build:
    name: Build FeatherCli (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            rid: linux-x64
            out_dir: dist/linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
            out_dir: dist/linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.arch }}-nuget-${{ hashFiles('cli/FeatherCli.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-nuget-

      - name: Build FeatherCli (${{ matrix.arch }})
        working-directory: cli
        run: |
          dotnet publish FeatherCli.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:PublishTrimmed=false \
            -o ${{ matrix.out_dir }}
          chmod +x ${{ matrix.out_dir }}/FeatherCli
          uname -m
          file ${{ matrix.out_dir }}/FeatherCli || true
          ${{ matrix.out_dir }}/FeatherCli --help
          ${{ matrix.out_dir }}/FeatherCli migrate --help

      - name: Upload FeatherCli binary (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: feathercli-linux-${{ matrix.arch }}
          path: cli/${{ matrix.out_dir }}/FeatherCli
          if-no-files-found: error
          retention-days: 1

  migrate-v1:
    name: Migrate smoke — Pterodactyl v1 (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            artifact_dir: cli/dist/linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            artifact_dir: cli/dist/linux-arm64
    services:
      database:
        image: mariadb:11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: featherpanel
        ports:
          - 3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s
    env:
      SEED_VARIANT: v1
      SEED_FILE: tests/fixtures/pterodactyl/seed.sql
      FEATHERCLI_BIN: ${{ matrix.artifact_dir }}/FeatherCli
      MIN_USERS: "10"
      MIN_NODES: "2"
      MIN_SERVERS: "10"
      MIN_SPELLS: "10"
      MIN_BACKUPS: "50"
      MIN_SCHEDULES: "20"
      MIN_DATABASES: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/storage/packages
          key: ${{ runner.os }}-${{ matrix.arch }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-composer-

      - name: Download FeatherCli binary (${{ matrix.arch }})
        uses: actions/download-artifact@v4
        with:
          name: feathercli-linux-${{ matrix.arch }}
          path: ${{ matrix.artifact_dir }}

      - name: Make FeatherCli executable
        run: |
          chmod +x "$FEATHERCLI_BIN"
          uname -m
          "$FEATHERCLI_BIN" --help >/dev/null

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Create FeatherPanel .env
        working-directory: backend
        run: |
          mkdir -p storage/config
          KEY=$(head -c 32 /dev/urandom | base64)
          cat > storage/config/.env <<EOF
          DATABASE_HOST=127.0.0.1
          DATABASE_PORT=${{ job.services.database.ports[3306] }}
          DATABASE_DATABASE=featherpanel
          DATABASE_USER=root
          DATABASE_PASSWORD=
          DATABASE_ENCRYPTION="xchacha20"
          DATABASE_ENCRYPTION_KEY="${KEY}"
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=testredis
          APP_URL=http://127.0.0.1:8080
          EOF

      - name: Wait for MariaDB
        working-directory: backend
        run: bash ../.github/scripts/feathercli-wait-mariadb.sh

      - name: Migrate FeatherPanel schema
        working-directory: backend
        run: php cli migrate --skip-path-check

      - name: Install MariaDB client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client

      - name: Seed Pterodactyl v1 + dump
        working-directory: backend
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
        run: bash ../.github/scripts/feathercli-seed-pterodactyl.sh

      - name: Bootstrap admin API key
        working-directory: backend
        run: php tests/fixtures/pterodactyl/bootstrap_admin.php /tmp/feathercli-api-key

      - name: Start panel HTTP
        working-directory: backend
        run: bash ../.github/scripts/feathercli-start-panel.sh

      - name: Run feathercli migrate (v1 / ${{ matrix.arch }})
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          FEATHERCLI_API_URL: http://127.0.0.1:8080
        run: bash .github/scripts/feathercli-run-migrate.sh

      - name: Assert imported entities (v1 / ${{ matrix.arch }})
        working-directory: backend
        run: bash ../.github/scripts/feathercli-assert-migrate.sh

      - name: Stop panel HTTP
        if: always()
        run: |
          if [ -f /tmp/panel-http.pid ]; then kill "$(cat /tmp/panel-http.pid)" || true; fi
          cat /tmp/panel-http.log || true

  migrate-v2:
    name: Migrate smoke — Pterodactyl v2 (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
