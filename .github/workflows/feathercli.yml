          KEY=$(head -c 32 /dev/urandom | base64)
          cat > storage/config/.env <<EOF
          DATABASE_HOST=127.0.0.1
          DATABASE_PORT=${{ job.services.database.ports[3306] }}
          DATABASE_DATABASE=featherpanel
