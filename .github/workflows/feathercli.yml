        ports:
          - 3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s
    env:
      SEED_VARIANT: v2
      SEED_FILE: tests/fixtures/pterodactyl/seed_v2.sql
      FEATHERCLI_BIN: ${{ matrix.artifact_dir }}/FeatherCli
      MIN_USERS: "10"
      MIN_NODES: "1"
      MIN_SERVERS: "8"
      MIN_SPELLS: "10"
      MIN_BACKUPS: "40"
      MIN_SCHEDULES: "8"
      MIN_DATABASES: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/storage/packages
          key: ${{ runner.os }}-${{ matrix.arch }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-composer-

      - name: Download FeatherCli binary (${{ matrix.arch }})
        uses: actions/download-artifact@v4
        with:
          name: feathercli-linux-${{ matrix.arch }}
          path: ${{ matrix.artifact_dir }}

      - name: Make FeatherCli executable
        run: |
          chmod +x "$FEATHERCLI_BIN"
