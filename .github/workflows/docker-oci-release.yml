name: Docker Build & Publish (OCI Release)

# Stable images: version tag + latest. Matches backend docker-release semantics.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g., v1.0.3). Required for manual runs."
        required: true
        type: string

jobs:
  build-oci:
    name: Build & Push OCI Image (Release) - ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: blacksmith-4vcpu-ubuntu-2404
            cache-key: amd64
          - platform: linux/arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            cache-key: arm64

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Set lowercase repository owner
        id: repo-owner
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$REPO_OWNER_LOWER" >> $GITHUB_OUTPUT

      - name: Set version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform tag
        id: platform-tag
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push OCI Image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.oci
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/featherpanel-oci:${{ steps.version.outputs.tag }}-${{ steps.platform-tag.outputs.tag }}

  manifest-oci:
    name: Create Multi-Arch Manifest - OCI (Release)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build-oci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Set lowercase repository owner
        id: repo-owner
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$REPO_OWNER_LOWER" >> $GITHUB_OUTPUT

      - name: Set version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for platform-specific images
        run: |
          echo "Waiting for platform-specific images to be available..."
          sleep 10

      - name: Create and push manifest (version + latest)
        run: |
          OWNER="${{ steps.repo-owner.outputs.owner }}"
          TAG="${{ steps.version.outputs.tag }}"
          docker buildx imagetools create --tag "ghcr.io/${OWNER}/featherpanel-oci:${TAG}" \
            "ghcr.io/${OWNER}/featherpanel-oci:${TAG}-linux-amd64" \
            "ghcr.io/${OWNER}/featherpanel-oci:${TAG}-linux-arm64"
          docker buildx imagetools create --tag "ghcr.io/${OWNER}/featherpanel-oci:latest" \
            "ghcr.io/${OWNER}/featherpanel-oci:${TAG}-linux-amd64" \
            "ghcr.io/${OWNER}/featherpanel-oci:${TAG}-linux-arm64"
