name: Docker Build & Publish (OCI All-in-One)

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
    paths:
      - "Dockerfile.oci"
      - ".github/workflows/docker-oci.yml"
      - "backend/**"
      - "frontendv2/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0 or latest)"
        required: false
        type: string
        default: "latest"

jobs:
  build-oci:
    name: Build & Push OCI Image - ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache-key: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-key: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/main || "${{ github.ref }}" == refs/heads/master ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tag=dev-${{ github.ref_name }}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform tag
        id: platform-tag
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push OCI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.oci
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/featherpanel-oci:buildcache-${{ matrix.cache-key }}
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/featherpanel-oci:buildcache-${{ matrix.cache-key }},mode=max
            type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/featherpanel-oci:${{ steps.version.outputs.tag }}-${{ steps.platform-tag.outputs.tag }}

  manifest-oci:
    name: Create Multi-Arch Manifest - OCI
    runs-on: ubuntu-latest
    needs: build-oci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/main || "${{ github.ref }}" == refs/heads/master ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tag=dev-${{ github.ref_name }}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for platform-specific images
        run: |
          echo "Waiting for platform-specific images to be available..."
          sleep 10

      - name: Create and push manifest
        run: |
          docker buildx imagetools create --tag ghcr.io/${{ github.repository_owner }}/featherpanel-oci:${{ steps.version.outputs.tag }} \
            ghcr.io/${{ github.repository_owner }}/featherpanel-oci:${{ steps.version.outputs.tag }}-linux-amd64 \
            ghcr.io/${{ github.repository_owner }}/featherpanel-oci:${{ steps.version.outputs.tag }}-linux-arm64
          docker buildx imagetools create --tag ghcr.io/${{ github.repository_owner }}/featherpanel-oci:latest \
            ghcr.io/${{ github.repository_owner }}/featherpanel-oci:${{ steps.version.outputs.tag }}-linux-amd64 \
            ghcr.io/${{ github.repository_owner }}/featherpanel-oci:${{ steps.version.outputs.tag }}-linux-arm64

