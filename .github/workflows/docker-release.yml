          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ./frontendv2/node_modules
          key: ${{ runner.os }}-pnpm-v2-${{ matrix.cache-key }}-${{ hashFiles('frontendv2/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-v2-${{ matrix.cache-key }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform tag
        id: platform-tag
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT

      - name: Setup PHP (OpenAPI for in-panel docs)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Generate OpenAPI specification
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          COMPOSER_ALLOW_SUPERUSER=1 composer openapi
          test -s openapi.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontendv2/pnpm-lock.yaml

      - name: Generate developer docs (not committed; baked into image)
        working-directory: frontendv2
        env:
          OPENAPI_JSON: ../backend/openapi.json
        run: |
          pnpm install --frozen-lockfile
          pnpm export:docs
          test -f public/icanhasfeatherpanel/api/openapi.json
          test -f public/icanhasfeatherpanel/api/oauth2.md

      - name: Build & Push Frontend v2
        uses: docker/build-push-action@v5
        with:
          context: ./frontendv2
          file: ./frontendv2/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          pull: true
          cache-from: |
            type=registry,ref=ghcr.io/mythicalltd/featherpanel-frontendv2:buildcache-${{ matrix.cache-key }}
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/mythicalltd/featherpanel-frontendv2:buildcache-${{ matrix.cache-key }},mode=max
            type=gha,mode=max
          tags: |
            ghcr.io/mythicalltd/featherpanel-frontendv2:${{ steps.version.outputs.tag }}-${{ steps.platform-tag.outputs.tag }}

  manifest-frontendv2:
    name: Create Multi-Arch Manifest - Frontend v2
    runs-on: ubuntu-latest
    needs: build-frontendv2
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
