            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for platform-specific images
        run: |
          echo "Waiting for platform-specific images to be available..."
          sleep 10

      - name: Create and push manifest
        run: |
          docker buildx imagetools create --tag ghcr.io/mythicalltd/featherpanel-frontendv2:${{ steps.version.outputs.tag }} \
            ghcr.io/mythicalltd/featherpanel-frontendv2:${{ steps.version.outputs.tag }}-linux-amd64 \
            ghcr.io/mythicalltd/featherpanel-frontendv2:${{ steps.version.outputs.tag }}-linux-arm64
          docker buildx imagetools create --tag ghcr.io/mythicalltd/featherpanel-frontendv2:latest \
            ghcr.io/mythicalltd/featherpanel-frontendv2:${{ steps.version.outputs.tag }}-linux-amd64 \
            ghcr.io/mythicalltd/featherpanel-frontendv2:${{ steps.version.outputs.tag }}-linux-arm64

  build-async-runner:
    name: Build & Push Async Runner (Release) - ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache-key: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-key: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Set version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform tag
        id: platform-tag
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Async Runner
        uses: docker/build-push-action@v5
        with:
          context: ./runner
          file: ./runner/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          pull: true
          cache-from: |
            type=registry,ref=ghcr.io/mythicalltd/featherpanel-async-runner:buildcache-${{ matrix.cache-key }}
            type=gha,scope=async-runner-${{ matrix.cache-key }}
          cache-to: |
            type=registry,ref=ghcr.io/mythicalltd/featherpanel-async-runner:buildcache-${{ matrix.cache-key }},mode=max
            type=gha,mode=max,scope=async-runner-${{ matrix.cache-key }}
          tags: |
            ghcr.io/mythicalltd/featherpanel-async-runner:${{ steps.version.outputs.tag }}-${{ steps.platform-tag.outputs.tag }}

  manifest-async-runner:
    name: Create Multi-Arch Manifest - Async Runner
    runs-on: ubuntu-latest
    needs: build-async-runner
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Set version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
