            ghcr.io/mythicalltd/featherpanel-async-runner:${{ steps.version.outputs.tag }}-linux-amd64 \
            ghcr.io/mythicalltd/featherpanel-async-runner:${{ steps.version.outputs.tag }}-linux-arm64
          docker buildx imagetools create --tag ghcr.io/mythicalltd/featherpanel-async-runner:latest \
            ghcr.io/mythicalltd/featherpanel-async-runner:${{ steps.version.outputs.tag }}-linux-amd64 \
            ghcr.io/mythicalltd/featherpanel-async-runner:${{ steps.version.outputs.tag }}-linux-arm64

  build-mcp:
    name: Build & Push MCP (Release) - ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
