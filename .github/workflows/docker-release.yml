      - name: Set platform tag
        id: platform-tag
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push MCP
        uses: docker/build-push-action@v5
        with:
          context: ./mcp
          file: ./mcp/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          pull: true
          cache-from: |
            type=registry,ref=ghcr.io/mythicalltd/featherpanel-mcp:buildcache-${{ matrix.cache-key }}
            type=gha,scope=mcp-${{ matrix.cache-key }}
          cache-to: |
            type=registry,ref=ghcr.io/mythicalltd/featherpanel-mcp:buildcache-${{ matrix.cache-key }},mode=max
            type=gha,mode=max,scope=mcp-${{ matrix.cache-key }}
          tags: |
            ghcr.io/mythicalltd/featherpanel-mcp:${{ steps.version.outputs.tag }}-${{ steps.platform-tag.outputs.tag }}

