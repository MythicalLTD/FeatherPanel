            ghcr.io/mythicalltd/featherpanel-async-runner:dev-${{ steps.tags.outputs.branch }}-${{ steps.tags.outputs.sha }}-linux-arm64
          docker buildx imagetools create --tag ghcr.io/mythicalltd/featherpanel-async-runner:dev-${{ steps.tags.outputs.branch }} \
