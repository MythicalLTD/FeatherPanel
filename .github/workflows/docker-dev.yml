            ${{ runner.os }}-pnpm-v2-${{ matrix.cache-key }}-

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: frontendv2/Dockerfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform tag
        id: platform-tag
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT

      - name: Setup PHP (OpenAPI for in-panel docs)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Generate OpenAPI specification
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          COMPOSER_ALLOW_SUPERUSER=1 composer openapi
          test -s openapi.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontendv2/pnpm-lock.yaml

      - name: Generate developer docs (not committed; baked into image)
        working-directory: frontendv2
        env:
          OPENAPI_JSON: ../backend/openapi.json
        run: |
          pnpm install --frozen-lockfile
          pnpm export:docs
          test -f public/icanhasfeatherpanel/api/openapi.json
          test -f public/icanhasfeatherpanel/api/oauth2.md

      - name: Build & Push Frontend v2
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./frontendv2
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/mythicalltd/featherpanel-frontendv2:dev-${{ steps.tags.outputs.branch }}-${{ steps.tags.outputs.sha }}-${{ steps.platform-tag.outputs.tag }}

