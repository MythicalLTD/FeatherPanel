      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ./frontendv2/node_modules
          key: ${{ runner.os }}-pnpm-v2-${{ matrix.cache-key }}-${{ hashFiles('frontendv2/pnpm-lock.yaml') }}
